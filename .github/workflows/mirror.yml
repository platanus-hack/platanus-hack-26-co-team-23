# Mirrors ONLY main and dev to the Platanus repo (judging) on every push.
# We don't mirror feature branches: they're transient, live in ComplAI-Crew (where
# PRs happen), and their rebases/force-pushes would break the mirror's fast-forward.
# Fast-forward-only push (no --force): if main/dev diverge (someone pushed directly
# to Platanus), this job FAILS on purpose — reconcile with pull/merge, never overwrite.
# Requires the MIRROR_TOKEN secret: a classic PAT (repo scope) from an account with
# write access to platanus-hack/platanus-hack-26-co-team-23.
name: mirror-to-platanus
on:
  push:
    branches: [main, dev]
concurrency:
  group: mirror
  cancel-in-progress: false
jobs:
  mirror:
    # This file gets mirrored into platanus-hack too, where it would run without the
    # MIRROR_TOKEN secret and fail (spamming failure emails). Only run in the source repo.
    if: github.repository == 'ComplAI-Crew/comply'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # without this, the bot's GITHUB_TOKEN stays as a global github.com extraheader
          # and overrides the MIRROR_TOKEN embedded in the push URL
          persist-credentials: false
      - name: Push main and dev to platanus mirror (fast-forward only)
        run: |
          MIRROR="https://x-access-token:${{ secrets.MIRROR_TOKEN }}@github.com/platanus-hack/platanus-hack-26-co-team-23.git"
          git fetch origin main dev
          git push "$MIRROR" origin/main:refs/heads/main
          git push "$MIRROR" origin/dev:refs/heads/dev
